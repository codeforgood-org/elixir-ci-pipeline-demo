# Example secrets configuration
# Copy this file to secrets.yaml and update with your actual values
# DO NOT commit secrets.yaml to version control!

apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secrets
type: Opaque
stringData:
  database-url: "ecto://postgres:changeme@postgres:5432/task_manager_prod"
  secret-key-base: "GENERATE_WITH_mix_phx_gen_secret_MINIMUM_64_CHARACTERS"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  username: "postgres"
  password: "changeme"
